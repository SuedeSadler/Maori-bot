<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EyeMech Control (Web)</title>
<style>
  body {
    font-family: monospace;
    background: #000;
    color: #b9a3f5;
    margin: 0;
    padding: 24px;
    min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 0 0 4px; color: #eee; font-weight: normal; }
  #status { margin-bottom: 16px; color: #7a6aa8; font-size: 13px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }

  .panel {
    background: #000;
    border: 1px solid #201a2a;
    border-radius: 8px;
    padding: 10px;
  }

  #videoPanel { width: 480px; }
  #asciiVideoPre {
    width: 460px; height: 300px;
    font-size: 5px; line-height: 5px; letter-spacing: -1px;
    white-space: pre; overflow: hidden; color: #6ad1a0; background: #000;
    font-family: monospace;
  }

  #coords { margin-top: 8px; font-size: 12px; color: #6ad1a0; }

  button {
    padding: 8px 16px; font-size: 13px; border-radius: 6px;
    border: 1px solid #3a2d5c; background: #140f1c; color: #b9a3f5; cursor: pointer;
    margin-top: 8px; margin-right: 8px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .warn { color: #a06a6a; margin-top: 8px; font-size: 12px; max-width: 460px; }

  #mouthPanel {
    position: absolute;
    top: 24px;
    left: 540px;
    width: 320px;
    height: 240px;
    resize: both;
    overflow: hidden;
    min-width: 180px;
    min-height: 140px;
    background: #000;
    border: 1px solid #3a2d5c;
    border-radius: 8px;
  }
  #mouthHandle {
    height: 22px;
    background: #140f1c;
    border-bottom: 1px solid #3a2d5c;
    cursor: grab;
    display: flex; align-items: center; padding: 0 8px;
    font-size: 11px; color: #7a6aa8; user-select: none;
  }
  #mouthHandle:active { cursor: grabbing; }
  #mouthContainer { width: 100%; height: calc(100% - 48px); overflow: hidden; }
</style>
</head>
<body>

<h1>EyeMech Control</h1>
<div id="status">Loading face detection model...</div>

<div class="row">
  <div class="panel" id="videoPanel">
    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <pre id="asciiVideoPre"></pre>
    <div id="coords">x: -- , y: --</div>
    <button id="connectBtn" disabled>Connect to Pico (Web Serial)</button>
    <button id="micBtn">Enable microphone (for mouth)</button>
    <div class="warn">Requires Chrome or Edge. The Pico must not be connected to Thonny at the same time.</div>
  </div>
</div>

<div id="mouthPanel">
  <div id="mouthHandle">mouth — drag to move, corner to resize</div>
  <select id="mouthFormSelect" style="width:100%; background:#140f1c; color:#b9a3f5; border:none; border-bottom:1px solid #3a2d5c; padding:4px 8px; font-family:monospace; font-size:11px;">
    <option value="mouth">mouth (opens when talking)</option>
    <option value="water">water box (rises when talking)</option>
    <option value="orb">orb</option>
    <option value="blob">blob</option>
    <option value="knot">knot</option>
    <option value="ring">ring</option>
    <option value="crystal">crystal</option>
  </select>
  <div id="mouthContainer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/effects/AsciiEffect.js"></script>

<script>
const video = document.getElementById('video');
const asciiVideoPre = document.getElementById('asciiVideoPre');
const statusEl = document.getElementById('status');
const coordsEl = document.getElementById('coords');
const connectBtn = document.getElementById('connectBtn');
const micBtn = document.getElementById('micBtn');

let model = null;
let port = null;
let writer = null;
let lastFaceTime = 0;
const FACE_TIMEOUT_MS = 800;

async function setupMedia() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 480, height: 360 },
    audio: true
  });
  video.srcObject = stream;

  const audioTracks = stream.getAudioTracks();
  if (audioTracks.length > 0) {
    setupAudioAnalyser(new MediaStream(audioTracks));
  }

  return new Promise(resolve => {
    video.onloadedmetadata = () => resolve();
  });
}

const sampleCanvas = document.createElement('canvas');
const SAMPLE_W = 90, SAMPLE_H = 55;
sampleCanvas.width = SAMPLE_W;
sampleCanvas.height = SAMPLE_H;
const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
const videoRamp = ' .:-=+*#%@'.split('');

function renderAsciiVideoFrame() {
  if (video.readyState >= 2) {
    sampleCtx.save();
    sampleCtx.scale(-1, 1);
    sampleCtx.drawImage(video, -SAMPLE_W, 0, SAMPLE_W, SAMPLE_H);
    sampleCtx.restore();

    const frame = sampleCtx.getImageData(0, 0, SAMPLE_W, SAMPLE_H).data;
    let out = '';
    for (let y = 0; y < SAMPLE_H; y++) {
      for (let x = 0; x < SAMPLE_W; x++) {
        const i = (y * SAMPLE_W + x) * 4;
        const lum = (frame[i] * 0.299 + frame[i+1] * 0.587 + frame[i+2] * 0.114) / 255;
        const idx = Math.min(videoRamp.length - 1, Math.floor(lum * videoRamp.length));
        out += videoRamp[idx];
      }
      out += '\n';
    }
    asciiVideoPre.textContent = out;
  }
  setTimeout(() => requestAnimationFrame(renderAsciiVideoFrame), 60);
}

async function connectSerial() {
  if (!('serial' in navigator)) {
    statusEl.textContent = 'Web Serial API not supported. Use Chrome or Edge.';
    return;
  }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    statusEl.textContent = 'Connected to Pico. Tracking active.';
    connectBtn.textContent = 'Connected';
    connectBtn.disabled = true;
  } catch (err) {
    statusEl.textContent = 'Serial connection failed: ' + err.message;
  }
}

async function sendCoords(normX, normY) {
  if (!writer) return;
  const msg = `${normX.toFixed(3)},${normY.toFixed(3)}\n`;
  try {
    await writer.write(new TextEncoder().encode(msg));
  } catch (err) {
    console.error('Serial write failed:', err);
  }
}

async function detectLoop() {
  const predictions = await model.estimateFaces(video, false);

  if (predictions.length > 0) {
    let best = predictions[0];
    let bestArea = 0;
    for (const p of predictions) {
      const w = p.bottomRight[0] - p.topLeft[0];
      const h = p.bottomRight[1] - p.topLeft[1];
      const area = w * h;
      if (area > bestArea) { bestArea = area; best = p; }
    }

    const x1 = best.topLeft[0], y1 = best.topLeft[1];
    const x2 = best.bottomRight[0], y2 = best.bottomRight[1];
    const cx = (x1 + x2) / 2;
    const cy = (y1 + y2) / 2;

    const w = video.videoWidth, h = video.videoHeight;

    const normX = -((cx - w / 2) / (w / 2));
    const normY = -((cy - h / 2) / (h / 2));

    const clampedX = Math.max(-1, Math.min(1, normX));
    const clampedY = Math.max(-1, Math.min(1, normY));

    coordsEl.textContent = `x: ${clampedX.toFixed(2)} , y: ${clampedY.toFixed(2)}`;

    sendCoords(clampedX, clampedY);
    lastFaceTime = performance.now();
  } else {
    if (performance.now() - lastFaceTime > FACE_TIMEOUT_MS) {
      coordsEl.textContent = 'x: -- , y: --  (no face)';
    }
  }

  requestAnimationFrame(detectLoop);
}

let audioCtx = null, analyser = null, dataArray = null;
let micActive = false;

function setupAudioAnalyser(micStream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  const source = audioCtx.createMediaStreamSource(micStream);
  source.connect(analyser);
  micActive = true;
  micBtn.textContent = 'Microphone active';
  micBtn.disabled = true;
}

function getVolume() {
  if (!analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
  return (sum / dataArray.length) / 255;
}

micBtn.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    setupAudioAnalyser(stream);
  } catch (err) {
    micBtn.textContent = 'Mic access denied';
  }
});

const mouthPanel = document.getElementById('mouthPanel');
const mouthHandle = document.getElementById('mouthHandle');
const mouthContainer = document.getElementById('mouthContainer');

(function makeDraggable() {
  let dragging = false, offX = 0, offY = 0;
  mouthHandle.addEventListener('pointerdown', (e) => {
    dragging = true;
    offX = e.clientX - mouthPanel.offsetLeft;
    offY = e.clientY - mouthPanel.offsetTop;
  });
  window.addEventListener('pointerup', () => dragging = false);
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    mouthPanel.style.left = (e.clientX - offX) + 'px';
    mouthPanel.style.top = (e.clientY - offY) + 'px';
  });
})();

const mouthScene = new THREE.Scene();
const mouthCamera = new THREE.PerspectiveCamera(60, 1, 1, 1000);
mouthCamera.position.z = 220;

mouthScene.add(new THREE.AmbientLight(0x222222));
const mLight1 = new THREE.PointLight(0xffffff, 1.2);
mLight1.position.set(150, 150, 200);
mouthScene.add(mLight1);
const mLight2 = new THREE.PointLight(0x8866ff, 0.6);
mLight2.position.set(-150, -100, -100);
mouthScene.add(mLight2);

const mouthMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 0.5 });
let mouthMesh = null;
let mouthGeometry = null;
let mouthBasePositions = null;
let currentMouthForm = 'mouth';

const mouthBoxHelper = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(140, 120, 140)),
  new THREE.LineBasicMaterial({ color: 0x8866ff })
);
mouthBoxHelper.visible = false;
mouthScene.add(mouthBoxHelper);

function makeMouthGeometry(type) {
  if (type === 'orb') return new THREE.IcosahedronGeometry(75, 2);
  if (type === 'blob') return new THREE.IcosahedronGeometry(75, 4);
  if (type === 'knot') return new THREE.TorusKnotGeometry(48, 16, 120, 16);
  if (type === 'ring') return new THREE.TorusGeometry(65, 26, 16, 60);
  if (type === 'crystal') return new THREE.OctahedronGeometry(85, 1);
  if (type === 'mouth') return new THREE.TorusGeometry(60, 15, 20, 60);
  if (type === 'water') return new THREE.PlaneGeometry(130, 130, 36, 36);
  return new THREE.TorusGeometry(60, 15, 20, 60);
}

function applyBlobNoise(geo) {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const ix = i * 3;
    const x = pos.array[ix], y = pos.array[ix+1], z = pos.array[ix+2];
    const n = Math.sin(x*0.08) * Math.cos(y*0.08) * Math.sin(z*0.08);
    const scale = 1 + n*0.18;
    pos.array[ix] = x*scale; pos.array[ix+1] = y*scale; pos.array[ix+2] = z*scale;
  }
  pos.needsUpdate = true;
}

function switchMouthForm(type) {
  if (mouthMesh) { mouthScene.remove(mouthMesh); mouthGeometry.dispose(); }
  currentMouthForm = type;
  mouthGeometry = makeMouthGeometry(type);
  if (type === 'blob') applyBlobNoise(mouthGeometry);
  mouthGeometry.computeVertexNormals();
  mouthMesh = new THREE.Mesh(mouthGeometry, mouthMaterial);

  if (type === 'water') {
    mouthMesh.rotation.x = -Math.PI / 2;
    mouthMesh.position.y = -55;
    mouthBoxHelper.visible = true;
  } else {
    mouthBoxHelper.visible = false;
  }

  mouthScene.add(mouthMesh);
  mouthBasePositions = mouthGeometry.attributes.position.array.slice();
}

switchMouthForm('mouth');

document.getElementById('mouthFormSelect').addEventListener('change', (e) => {
  switchMouthForm(e.target.value);
});

const mouthRenderer = new THREE.WebGLRenderer();
const mouthEffect = new THREE.AsciiEffect(mouthRenderer, ' .:-+*=%@#', { invert: true, resolution: 0.2 });
mouthEffect.domElement.style.color = '#b9a3f5';
mouthEffect.domElement.style.backgroundColor = '#000';
mouthEffect.domElement.style.fontFamily = 'monospace';
mouthEffect.domElement.style.letterSpacing = '-1px';
mouthContainer.appendChild(mouthEffect.domElement);

function resizeMouth() {
  const w = mouthContainer.clientWidth || 300;
  const h = mouthContainer.clientHeight || 220;
  mouthCamera.aspect = w / h;
  mouthCamera.updateProjectionMatrix();
  mouthRenderer.setSize(w, h);
  mouthEffect.setSize(w, h);
}
new ResizeObserver(resizeMouth).observe(mouthContainer);
resizeMouth();

let mouthRotY = 0;
let mouthLevelSmoothed = 0;
let mouthClock = 0;

function mouthSmoothedLevel() {
  const raw = micActive ? getVolume() : 0;
  mouthLevelSmoothed += (raw - mouthLevelSmoothed) * 0.2;
  return mouthLevelSmoothed;
}

function animateMouth() {
  const smoothed = mouthSmoothedLevel();
  mouthClock++;
  mouthRotY += 0.002;

  if (currentMouthForm === 'water') {
    mouthMesh.rotation.z = mouthRotY;
    mouthBoxHelper.rotation.y = mouthRotY;

    const pos = mouthGeometry.attributes.position;
    const waterLevel = -35 + smoothed * 90;
    for (let i = 0; i < pos.count; i++) {
      const ix = i * 3;
      const lx = mouthBasePositions[ix], ly = mouthBasePositions[ix+1];
      const ripple = Math.sin(lx*0.15 + mouthClock*0.06)*3 + Math.cos(ly*0.17 + mouthClock*0.08)*3;
      pos.array[ix+2] = (waterLevel + ripple*(0.3+smoothed)) - mouthMesh.position.y;
    }
    pos.needsUpdate = true;
    mouthGeometry.computeVertexNormals();

  } else if (currentMouthForm === 'mouth') {
    mouthMesh.rotation.y = mouthRotY;
    const openAmt = 0.14 + smoothed * 1.15;
    mouthMesh.scale.set(1.25, openAmt, 0.55);

  } else {
    mouthMesh.rotation.y = mouthRotY;
    const pulse = 1 + smoothed * 0.35;
    mouthMesh.scale.setScalar(pulse);

    const posA = mouthGeometry.attributes.position;
    for (let j = 0; j < posA.count; j++) {
      const jx = j * 3;
      const nx = mouthBasePositions[jx], ny = mouthBasePositions[jx+1], nz = mouthBasePositions[jx+2];
      const jitter = 1 + (micActive ? smoothed * 0.12 * Math.sin(j + mouthClock*0.1) : 0);
      posA.array[jx] = nx*jitter; posA.array[jx+1] = ny*jitter; posA.array[jx+2] = nz*jitter;
    }
    posA.needsUpdate = true;
    mouthGeometry.computeVertexNormals();
  }

  mouthEffect.render(mouthScene, mouthCamera);
  requestAnimationFrame(animateMouth);
}

async function init() {
  await setupMedia();
  model = await blazeface.load();
  statusEl.textContent = 'Model loaded. Click "Connect to Pico" to begin.';
  connectBtn.disabled = false;
  detectLoop();
  renderAsciiVideoFrame();
  animateMouth();
}

connectBtn.addEventListener('click', connectSerial);

init().catch(err => {
  statusEl.textContent = 'Error: ' + err.message;
});
</script>

</body>
</html>
